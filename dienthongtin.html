<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="ufc-8">
        <title>Đăng ký thông tin </title>
    </head>
    <body >
   

        <fieldset style="width: 500px;;height: 400px;">
            <legend align="center" style="color: rgb(58, 58, 138);font-size: 30px;"><b>Phiếu đăng ký</b></legend>
            <p>
             <form>
                <label for="name">Họ và tên:</label><br>
                <input id="name" type="text" style="width: 500px;;height: 20px;">
            </form>
            </p>
            <p>
                <form>
                    <label for="date">Ngày Sinh:</label><br>
                    <input id="date" type="date" style="width: 505px;;height: 25px;">
                </form>
            </p>
            <p>
                <form>
                    <label>Lớp:</label><br>
                    <select style="width: 510px;height: 30px;">
                            <option value="12A1">12A1</option>
                            <option value="12A2">12A2</option>
                            <option value="12A3">12A3</option>
                            <option value="12A4">12A4</option>
                    </select>
                </form>
            </p>
            <p>
                <form>
                    <label >Chọn môn muốn đăng ký:</label><br>
                    <input type="checkbox" value="Toán">Toán<br>
                    <input type="checkbox" value="Lý">Lý<br>
                    <input type="checkbox" value="Tin">Tin<br>
                    <input type="checkbox" value="Hóa">Hóa
                </form>
            </p>
            <p align="center" style="height: 30;width: 50;color: chartreuse;">
                <input style="color: rgb(245, 245, 244);background-color: rgb(24, 190, 62);width: 150px;height: 40px;" type="submit" value="Gửi thông tin">
            </p>
        </fieldset>
    </body>
</html>
